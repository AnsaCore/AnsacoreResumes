work_experience:
  - title: 'Senior Data Engineering Tech Lead'
    employer: 'KBC'
    time: '2021 - Present'
    description: >-
      This position revolves mostly around development of data pipelines, both on-prem and in the cloud.
      I used Python, Jupyter, IntelliJ, PySpark, AWS S3, AWS SSM, AWS ECR, AWS Step Functions, DynamoDB and AWS Lambda 
      in a development context using 
      the Python boto3 API. I also used Apache Airflow to create DAGs, Docker to create containers that had to run on
      Airflow and Kubernetes to check on running containers with a faulty status. CI/CD pipelines were set up using
      Concourse and/or Jenkins, which I occasionally had to modify as well.
      I received formal trainings in PySpark, Airflow and Terraform, which I also continued to use during my spare time.
      <br>
      <br>
      Right now I'm working on a self-created project called EASE that allows non-technical colleagues to validate and run pipelines in production and 
      acceptance before the pipeline has been deployed to those pillars. It saves a lot of precious time for both developers and analysts and 
      has significantly reduced the probability of deploying faulty code. In short: 
      the speed and quality of the team as a whole has increased significantly, which is something I'm very very proud of.
      <br>
      <br>
      ACE and FUN are two other interesting projects that I started at KBC. ACE allows you to correct historical data while 
      solely focussing on the correction logic. FUN is a mechanism to share and version reusable notebooks. It's not just about the 
      notebooks, it's also about the knowledge you are able to spread to the team.
      <br>
      <br>
      I also enjoy sparking a conversation. There was a piece of functionality for which a DynamoDB is the best possible 
      technology. KBC's data platform is quite restrictive and doesn't allow using DynamoDB. However, I insisted that 
      we can't let stuff like this slide and that we should really focus on getting that cloud-native mindset on point. 
      With success!
      <br>
      <br>
      After one year, I've learned a lot and I am now considered to be a senior PySpark developer.
      The short time horizon in which I achieved this really boosted my confidence in my ability to learn.
