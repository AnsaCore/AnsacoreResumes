  - title: 'Experimenting with AWS Gateway API web sockets'
    description: >-
      Everyone knows the key to a successful frontend is: not having to refresh the application in order to see up-to-date data.
      That's why I was interested to implement a live-updating counter as some form of competition among friends.
      Every time something specific happened in our day we could hit the counter button and our score would increase.
      If someone else hit the count button then the score would also update on my screen. Success!!
